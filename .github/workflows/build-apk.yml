name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Clean Flutter
        run: flutter clean

      - name: Stop Gradle daemons
        working-directory: android
        run: ./gradlew --stop || true

      - name: Build release APK
        env:
          CI: true
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dorg.gradle.parallel=false"
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build.log

      - name: Check APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

      - name: Show build log on failure
        if: failure()
        run: |
          echo "===== FLUTTER BUILD LOG ====="
          cat build.log || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ali-goat-farm-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
