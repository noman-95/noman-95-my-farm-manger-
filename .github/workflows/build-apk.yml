name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Clean Flutter
        run: flutter clean

      - name: Stop Gradle daemons
        working-directory: android
        run: ./gradlew --stop || true

      - name: Build release APK
        env:
          CI: true
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dorg.gradle.parallel=false"
        run: |
          set -euxo pipefail

          flutter pub get

          # Prepare Flutter Android dependencies/files
          flutter precache --android

          cd android

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

          cd ..

          echo "===== GENERATED APK FILES ====="
          find . -type f -name "*.apk" -print

          APK="$(find android/app/build/outputs -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No APK was generated"
            exit 1
          fi

          mkdir -p build/app/outputs/flutter-apk

          cp "$APK" build/app/outputs/flutter-apk/app-release.apk

          echo "===== FINAL APK ====="
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Check Android build outputs
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

          echo "===== ANDROID BUILD OUTPUTS ====="
          find android/app/build -maxdepth 6 -type f -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ali-goat-farm-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
