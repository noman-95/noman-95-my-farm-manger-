name: Build signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || exit 1
          test -n "$ANDROID_KEYSTORE_PASSWORD" || exit 1
          test -n "$ANDROID_KEY_PASSWORD" || exit 1
          test -n "$ANDROID_KEY_ALIAS" || exit 1

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK with Gradle
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Find and prepare APK
        run: |
          echo "Searching for release APK..."

          APK_PATH=$(find android/app/build/outputs -type f -name "*.apk" | grep "/release/" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            find android/app/build/outputs -type f -print
            exit 1
          fi

          echo "Found APK: $APK_PATH"

          mkdir -p build/app/outputs/flutter-apk

          cp "$APK_PATH" build/app/outputs/flutter-apk/app-release.apk

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: my-farm-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
