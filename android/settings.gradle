pluginManagement {
    def flutterSdkPath = System.getenv("FLUTTER_ROOT")

    if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        flutterSdkPath = properties.getProperty("flutter.sdk")
    }

    if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
        throw new GradleException("Flutter SDK not found. FLUTTER_ROOT is not set and flutter.sdk is missing from local.properties.")
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

rootProject.name = "farm_manager"
include ":app"
