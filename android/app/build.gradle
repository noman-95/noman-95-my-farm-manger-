plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.farm_manager'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.farm_manager'
        minSdk 24
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile keystoreProperties.getProperty('storeFile') ?
                file(keystoreProperties.getProperty('storeFile')) : null

            storePassword keystoreProperties.getProperty('storePassword', '')
            keyAlias keystoreProperties.getProperty('keyAlias', '')
            keyPassword keystoreProperties.getProperty('keyPassword', '')
        }
    }

    buildTypes {
        release {
            // Use the private release keystore restored by the GitHub Actions workflow.
            // Never sign an Appstore release with the Android debug certificate.
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds = false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}
